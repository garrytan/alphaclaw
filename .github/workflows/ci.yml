name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token (fix wave F177): the job runs third-party code (npm
# lifecycle scripts, the UI build, the test suite) with GITHUB_TOKEN in the
# step env; nothing here needs to write to the repo.
permissions:
  contents: read
  # The PR test-inventory guard downloads the base commit's inventory artifact.
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The branch ruleset requires the context "test (24)" plus the container
    # `gate`. Node 26 runs as an early-warning lane (fix wave F178 pattern): its
    # failure is reported but does not block the merge until the ruleset lists
    # "test (26)" as required (promote it once it has been green for a week).
    # Node 22 left the matrix in v0.9.80: OpenClaw 2026.9.3 requires >=24.16.
    # OpenClaw 2026.10.6 (v0.10.48) requires >=24.22.1 / >=26.12.1, newer
    # than the runner image's cached Node can be, so setup-node resolves the
    # newest patch of each line (check-latest) instead of the toolcache copy.
    continue-on-error: ${{ matrix.node-version == 26 }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm

      # Version guard: a PR's package.json version must strictly advance the
      # base branch's, so concurrent PRs can't both claim the same number and
      # slip through (the renumber races the v0.9.3x–v0.9.6x wave hit). Every
      # PR bumps, including reverts. See CLAUDE.md "Merge unification safety".
      - name: Version guard
        # Once per PR is enough — the guard is not Node-version dependent.
        if: github.event_name == 'pull_request' && matrix.node-version == 24
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git show "origin/${BASE_REF}:package.json" > /tmp/base-package.json
          node scripts/ci/assert-version-advances.mjs /tmp/base-package.json ./package.json

      - run: npm ci

      - run: npm run build:ui

      - run: npm install --global pnpm@11.15.1

      # The JSON report is this run's test inventory (tests/setup-inventory.js
      # adds assertion and retry counts).
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-reports/vitest.json

      - name: Build the test inventory
        if: always() && matrix.node-version == 24 && hashFiles('test-reports/vitest.json') != ''
        run: node scripts/ci/test-inventory.mjs --out test-reports/inventory.json test-reports/vitest.json

      # Main's inventory per commit: the base every PR is compared against.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && matrix.node-version == 24 && hashFiles('test-reports/inventory.json') != ''
        with:
          name: test-inventory-node24
          path: test-reports/inventory.json

      # A test or test file that disappears, or a passing test that becomes
      # skipped, is a coverage loss unless a commit in the PR declares it
      # (Removed-test-file: / Removed-test: / Skipped-test: lines; see
      # CLAUDE.md). Report-only for its first week, then enforce.
      - name: Test inventory guard
        if: github.event_name == 'pull_request' && matrix.node-version == 24
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INVENTORY_GUARD: report
        run: bash scripts/ci/inventory-guard.sh

  # Hermetic coverage for every commit on main: the before/after reference for
  # changes to the test setup (scripts/ci/coverage-diff.mjs compares two
  # coverage-final.json files location by location).
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci

      - run: npm run build:ui

      - run: npm install --global pnpm@11.15.1

      - run: npx vitest run --coverage --coverage.reportOnFailure=true --coverage.reporter=json --coverage.reporter=json-summary --coverage.reporter=text-summary --coverage.reportsDirectory=coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node24
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
          if-no-files-found: ignore
