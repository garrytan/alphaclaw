name: Container E2E

# The production-container journey: build the image from this checkout, boot
# the REAL pinned OpenClaw gateway in a fresh container and again after
# `docker restart`, prove the boot spine survives a legacy pidfile TID
# collision and a dangling restart operation, and upgrade an immutable
# v0.9.76 image to the candidate on one persistent volume
# (tests/container/**). Heavy (110-minute job budget), so PR runs are gated by
# a cheap path filter job — but the workflow itself ALWAYS triggers on PRs
# (no `paths:` filter: a path-filtered required check pends forever on
# non-matching PRs; the `gate` job below reports success instead).

# NOTE: GitHub disables `schedule` triggers in repos with no activity for 60
# days — if this repo goes quiet, re-enable the workflow or run it via
# workflow_dispatch; the drift alarm does not fire while disabled.

on:
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:
  pull_request:

# Read-only token: the job executes third-party code (npm lifecycle scripts,
# real OpenClaw installs) with GITHUB_TOKEN in the step env.
permissions:
  contents: read

jobs:
  # Cheap decider: PRs only pay the heavy job when they touch the boot /
  # gateway / container surface. Schedule + dispatch always run it.
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        name: Decide whether the heavy job runs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event → heavy job always runs"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "changed files:"
          echo "$changed"
          # The heavy job boots the FULL server on the container journey:
          # the bin-phase pidfile guard and channel retirement, the boot
          # report, the once-per-pin doctor --fix, watchdog, startup, and
          # every routes/* module load, so PRs changing any of them run it.
          # The journey waits on login.html and signs in through the auth
          # API, so login.html is part of the filter too (fix wave F173).
          pattern='^(lib/server/openclaw-|lib/server/boot-|lib/server/server-pidfile\.js|lib/engines-range\.js|lib/node-runtime\.js|lib/server/gateway|lib/server/watchdog|lib/server/doctor|lib/server/routes/|lib/server/startup\.js|lib/server/diagnose/|lib/server\.js|bin/alphaclaw\.js|Dockerfile|tests/container/|lib/boot-placeholder|lib/public/login\.html|vitest\.config\.js|\.github/workflows/container-e2e\.yml)'
          if echo "$changed" | grep -qE "$pattern"; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "boot/gateway/container surface touched → heavy job runs"
          # A pin bump is a CONTENT change inside package.json (fix wave
          # F173): match the `"openclaw":` dependency line in the diff, never
          # the bare file name (every version bump touches package.json).
          elif git diff "origin/${BASE_REF}...HEAD" -- package.json | grep -qE '^[-+]\s*"openclaw":'; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "openclaw pin changed in package.json → heavy job runs"
          # Same for the script that selects the tier.
          elif git diff "origin/${BASE_REF}...HEAD" -- package.json | grep -qE '^[-+]\s*"test:container":'; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "test:container script changed in package.json → heavy job runs"
          else
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
            echo "no matching paths → heavy job skipped (gate reports success)"
          fi

  container-e2e:
    needs: filter
    if: needs.filter.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    # One job per leg of tests/container/shards.json, each on its own runner,
    # so the gate waits for the slowest leg instead of the sum of all four
    # files (median 752 s serially). `gate` aggregates the matrix: any failed
    # or cancelled leg fails it.
    strategy:
      fail-fast: false
      matrix:
        leg: [durability, self-upgrade, boot-progress]
    # Budget: image build (~5 min) + the leg's journey (the self-upgrade leg
    # builds two images and allows up to 60 min); the job limit must exceed
    # the tests' own worst case so vitest reports a timeout instead of the
    # runner killing the process.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # The pinned OpenClaw requires Node >=24.22.1; resolve the newest 24.x,
          # not the runner's cached copy.
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci

      # The leg's files come from the shard map, never from a ${{ }}
      # expression inside a script. Vitest is called with those files only:
      # `npm run test:container -- <files>` would keep the script's own
      # tests/container argument and run every file in every leg.
      - name: Resolve the leg's test files
        id: leg
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          files=$(node -e 'const leg = require("./tests/container/shards.json").legs[process.env.LEG]; if (!leg || !leg.files.length) { console.error("no files for leg " + process.env.LEG); process.exit(1); } console.log(leg.files.join(" "));')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Run the leg
        env:
          OPENCLAW_CONTAINER_E2E: "1"
          LEG: ${{ matrix.leg }}
          LEG_FILES: ${{ steps.leg.outputs.files }}
          # Authenticated GitHub API calls (AlphaClaw release notes) — the
          # anonymous quota is shared per runner IP and flakes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npx vitest run --no-file-parallelism $LEG_FILES --reporter=default --reporter=json --outputFile="tests/container/artifacts/report-$LEG.json"

      # The report must hold exactly the leg's files: a selection that ran
      # more (or fewer) files fails here, not silently.
      - name: Check the leg ran exactly its files
        env:
          LEG: ${{ matrix.leg }}
          LEG_FILES: ${{ steps.leg.outputs.files }}
        run: |
          node -e '
            const path = require("path");
            const report = require(path.resolve("tests/container/artifacts/report-" + process.env.LEG + ".json"));
            const ran = report.testResults.map((r) => path.relative(process.cwd(), r.name)).sort();
            const want = process.env.LEG_FILES.split(" ").sort();
            if (JSON.stringify(ran) !== JSON.stringify(want)) { console.error("leg ran", ran, "expected", want); process.exit(1); }
            console.log("leg " + process.env.LEG + ": " + ran.length + " files, " + report.numTotalTests + " tests");
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-e2e-artifacts-${{ matrix.leg }}
          path: tests/container/artifacts/
          if-no-files-found: ignore

  # Mark THIS job required in branch protection (not container-e2e): it
  # succeeds both when the heavy job passed and when the filter skipped it,
  # and fails only when the heavy job actually failed or was cancelled.
  gate:
    needs: [filter, container-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if the filter or the heavy job failed
        run: |
          filter="${{ needs.filter.result }}"
          heavy="${{ needs.container-e2e.result }}"
          echo "filter result: $filter / container-e2e result: $heavy"
          if [ "$filter" != "success" ]; then
            exit 1
          fi
          if [ "$heavy" = "failure" ] || [ "$heavy" = "cancelled" ]; then
            exit 1
          fi
          exit 0
