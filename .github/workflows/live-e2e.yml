name: Live E2E (real OpenClaw releases)

# Opt-in live tiers: these hit the real npm registry and the real GitHub API,
# and (in the dev job) run a real from-source OpenClaw build. Their job is to
# catch UPSTREAM drift — dist-tag/classification changes, engines, updater
# JSON contract, dist layout — that the hermetic `npm test` suites cannot see.
# A failure here usually means "upstream changed", not "this repo regressed".

# NOTE: GitHub disables `schedule` triggers in repos with no activity for 60
# days — if this repo goes quiet, re-enable the workflow or run it via
# workflow_dispatch; the drift alarm does not fire while disabled.

on:
  schedule:
    # Nightly: catalog + real stable/beta package applies (~5 min).
    - cron: "17 9 * * *"
    # Weekly (Sunday): additionally the full dev source build (20-35 min).
    # NOTE: this exact string is byte-matched by live-dev-build's `if:` gate
    # below — change BOTH together or the dev tier silently never runs.
    - cron: "47 9 * * 0"
  workflow_dispatch:
    inputs:
      run_dev_build:
        description: "Also run the full dev-channel source build (20-35 min)"
        type: boolean
        default: false

# Read-only token: these jobs execute third-party code (npm lifecycle
# scripts, a from-source build) with GITHUB_TOKEN in the step env.
permissions:
  contents: read

jobs:
  live-catalog-and-apply:
    runs-on: ubuntu-latest
    # Budgets: 3 catalog tests (90s each) + 2 package applies (12 min each)
    # + setup; the job limit must exceed the tests' own worst case so vitest
    # can report a timeout instead of the runner killing the process.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:live
        env:
          # Authenticated GitHub API calls — the anonymous quota (60/hr) is
          # shared per runner IP and flakes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  live-dev-build:
    # Weekly schedule or explicit dispatch opt-in only: a real git clone +
    # pnpm install + from-source build of openclaw main (~5 GB, build RAM).
    # The cron literal must byte-match the weekly entry in on.schedule above.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 9 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_dev_build)
    runs-on: ubuntu-latest
    # Dry-run contract (5 min) + full build (35-min test timeout) + setup. The
    # script runs ONLY the dev file — the same weekly cron already triggers
    # the nightly job for catalog/apply, and stacking their ~3 GB of temp
    # trees under the dev build's 5 GB disk preflight would starve it.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The dev pipeline's own toolchain preflight can install pnpm via
      # corepack, but doing it here keeps the test log about the build.
      - run: corepack enable pnpm || npm install -g pnpm

      - run: npm run test:live:dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
