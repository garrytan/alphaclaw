<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alphaclaw</title>
    <link rel="icon" type="image/svg+xml" href="./img/logo.svg" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/tailwind.generated.css" />
    <script src="./js/theme-prepaint.js"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full relative z-10">
      <div class="text-center mb-6">
        <img
          src="./img/logo.svg"
          alt="alphaclaw"
          class="mx-auto mb-4"
          width="48"
          height="49"
        />
        <h1 class="text-2xl font-semibold mb-2">
          <span style="color: var(--accent)">alpha</span>claw
        </h1>
        <p style="color: var(--text-muted)" class="text-xs mb-4">
          OpenClaw made easy
        </p>
      </div>
      <form
        id="login-form"
        class="bg-surface border border-border rounded-xl p-4 space-y-3"
      >
        <p id="invite-heading" class="text-sm hidden" style="color: var(--text)">
          You've been invited to this AlphaClaw. Create your account:
        </p>
        <input
          id="email"
          type="email"
          placeholder="Email"
          autocomplete="username"
          class="w-full bg-field border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-fg-muted hidden"
          style="color: var(--text)"
        />
        <input
          id="display-name"
          type="text"
          placeholder="Display name (optional)"
          autocomplete="name"
          class="w-full bg-field border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-fg-muted hidden"
          style="color: var(--text)"
        />
        <input
          id="password"
          type="password"
          placeholder="Password"
          autofocus
          autocomplete="current-password"
          class="w-full bg-field border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-fg-muted"
          style="color: var(--text)"
        />
        <input
          id="password-confirm"
          type="password"
          placeholder="Confirm password"
          autocomplete="new-password"
          class="w-full bg-field border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-fg-muted hidden"
          style="color: var(--text)"
        />
        <div id="error" class="text-status-error-muted text-xs hidden"></div>
        <button
          id="submit-btn"
          type="submit"
          disabled
          class="w-full text-sm font-medium px-4 py-2 rounded-lg ac-btn-cyan"
        >
          Enter
        </button>
        <button
          id="mode-toggle"
          type="button"
          class="w-full text-xs hidden"
          style="color: var(--text-muted)"
        ></button>
      </form>
    </div>
    <script src="./js/login.js"></script>
  </body>
</html>
